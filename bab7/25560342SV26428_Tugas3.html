<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tugas 3</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .btn {
        padding: 10px 20px;
        margin: 10px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .btn:hover {
        background-color: #0056b3;
      }

      .hover-btn:hover {
        color: yellow;
      }

      .transform-btn:hover {
        transform: scale(1.1);
      }

      .shadow-btn:hover {
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3);
      }

      .loading-spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #007bff;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin: 50px auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .fade-in {
        opacity: 0;
        animation: fadeIn 2s forwards;
        margin-top: 20px;
        text-align: center;
      }

      @keyframes fadeIn {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <button class="btn hover-btn">Hover Me</button>
    <button class="btn transform-btn">Transform Me</button>
    <button class="btn shadow-btn">Shadow Me</button>

    <div class="loading-spinner"></div>

    <div class="fade-in">Welcome to My Website!</div>
  </body>
</html>
